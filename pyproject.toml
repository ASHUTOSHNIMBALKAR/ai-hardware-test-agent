[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-test-agent"
version = "0.1.0"
description = "AI Agent for Hardware Test Automation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hardware Test Agent Developer" }
]
dependencies = [
    "pydantic>=2.0",
    "pyvisa>=1.14",
    "pyvisa-sim>=0.7",
    "pytest>=8.0",
    "typer>=0.9",
    "jinja2>=3.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.24",
]

[project.scripts]
hwtest = "hw_test_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
